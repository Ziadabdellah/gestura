name: gestura
description: Learn the sign language of the country you live in.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  gestura_core:
    path: ../../packages/gestura_core
  gestura_ui:
    path: ../../packages/gestura_ui
  get_it: ^9.3.0
  go_router: ^18.1.3
  injectable: ^3.0.0
  intl: ^0.20.3
  meta: ^1.19.0
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.3
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
