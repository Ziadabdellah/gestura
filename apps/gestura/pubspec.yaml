name: gestura
description: Learn the sign language of the country you live in.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  clock: ^1.1.3
  cloud_firestore: ^7.1.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  gestura_core:
    path: ../../packages/gestura_core
  gestura_ui:
    path: ../../packages/gestura_ui
  get_it: ^9.3.0
  go_router: ^18.1.3
  injectable: ^3.0.0
  intl: ^0.20.3
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  alchemist: ^0.14.1
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  firebase_core_platform_interface: ^8.1.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.3
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.10
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - path: assets/content/demo/
      flavors:
        - dev
        - staging
    - path: assets/content/demo/media/
      flavors:
        - dev
        - staging
