name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rules · Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          firebase-config: ${{ secrets.FIREBASE_CONFIG_TGZ_B64 }}

      - name: Repository rules
        run: |
          if git grep -nE '^[[:space:]]*(//|/\*)|[[:space:]]//[[:space:]]' -- '*.dart' '*.kt' '*.kts' '*.swift' '*.xcconfig'; then
            echo "Comments are not allowed in Dart, Kotlin, Gradle, Swift or xcconfig files."
            exit 1
          fi
          if git grep -nE '^[[:space:]]*#' -- '*.yaml' '*.yml' '*.properties' '*.gitignore' '*.metadata'; then
            echo "Comments are not allowed in YAML, properties, .gitignore or .metadata files."
            exit 1
          fi
          if git grep -nE '<!--' -- '*.xml' '*.plist' '*.xcscheme'; then
            echo "Comments are not allowed in XML, plist or scheme files."
            exit 1
          fi
          if git grep -nE '(^|[[:space:]])--|/\*' -- '*.drift'; then
            echo "Comments are not allowed in Drift files."
            exit 1
          fi

      - name: Format
        run: dart run melos run format --no-select

      - name: Code generation
        run: dart run melos run gen --no-select

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Dart tests
        run: dart run melos run test:dart --no-select

      - name: Flutter tests
        run: dart run melos run test:flutter --no-select

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: |
            packages/**/failures/**
            apps/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/rules-tests/package-lock.json

      - name: Install
        working-directory: firebase/rules-tests
        run: npm ci

      - name: Test the rules on the emulator
        run: firebase/rules-tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-gestura "cd firebase/rules-tests && npm test"
