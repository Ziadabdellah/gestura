name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - العربية
        - Русский
        - Español
        - Français
        - Deutsch
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
