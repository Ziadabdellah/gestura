name: Setup
description: Install the Flutter version pinned in .fvmrc and resolve the workspace.

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .fvmrc
        channel: stable
        cache: true

    - name: Resolve the workspace
      shell: bash
      run: flutter pub get
