<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestura</title>
<style>:root{color-scheme:light dark;--bg:#F8F6F1;--text:#14222B;--muted:#4A5A63;--accent:#0B6E69;--card:#FFFFFF;--line:#E2DED5}
@media (prefers-color-scheme:dark){:root{--bg:#0E1517;--text:#E4ECEA;--muted:#A7B6B4;--accent:#62D3C6;--card:#16211F;--line:#27322F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#15877F,#085550)}
h1{font-size:28px;line-height:1.25;margin:16px 0 4px}
h2{font-size:19px;margin:32px 0 8px;color:var(--accent)}
p,li{margin:8px 0}
a{color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px}
nav a[aria-current]{font-weight:700;text-decoration:none}
.muted{color:var(--muted);font-size:15px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 20px;margin-top:24px}</style>
</head>
<body>
<main>
<header><div class="mark" aria-hidden="true"></div><strong>Gestura</strong></header>
<h1>Gestura</h1>
<p>Sign language, in your hands.</p>
<p><a href="/privacy">Privacy policy</a> · <a href="/terms">Terms of use</a> · <a href="/delete-account">Delete your account</a></p>
</main>
</body>
</html>
